AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - Event-driven weekly report architecture on AWS:
  EventBridge Scheduler -> SQS -> report-builder Lambda (VPC, Aurora/PostgreSQL) -> S3 Gateway VPCEndpoint -> S3 -> report-mailer Lambda -> Amazon SES.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.
  ImageUri:
    Type: String
    Description: Backend container image URI for the report builder.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
  VpcId:
    Type: String
    Description: VPC ID where the backend and database run.
  SubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs for the report builder Lambda.
  SecurityGroupId:
    Type: String
    Description: Security group ID allowing access to the database.
  RouteTableId:
    Type: String
    Description: Route table ID of the private subnets to attach the S3 Gateway VPCEndpoint.
  DbHost:
    Type: String
    Description: PostgreSQL endpoint hostname.
  DbPort:
    Type: String
    Default: "5432"
  DbName:
    Type: String
    Default: meetings
  DbUsername:
    Type: String
    Default: meetings
  DbSecretArn:
    Type: String
    Description: Secrets Manager secret ARN for DB credentials.
  SenderEmail:
    Type: String
    Default: arlamovskao@gmail.com
    Description: Verified sender email address in Amazon SES.
  RecipientEmail:
    Type: String
    Default: arlamovskao@gmail.com
    Description: Recipient email address for the weekly reports.

Resources:
  # =====================================================================
  # Storage: S3 Bucket & S3 Gateway Endpoint
  # =====================================================================
  S3GatewayEndpoint:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref RouteTableId

  ReportsBucket:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::S3::Bucket
    DependsOn:
      - ReportMailerPermission
      - ReportRequestsQueuePolicy
    Properties:
      BucketName: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter90Days
            Status: Enabled
            ExpirationInDays: 90
          - Id: DeleteRequestsAfter1Day
            Status: Enabled
            Prefix: requests/
            ExpirationInDays: 1
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: reports/
                  - Name: suffix
                    Value: .csv
            Function: !GetAtt ReportMailerFunction.Arn
        QueueConfigurations:
          - Event: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: requests/
                  - Name: suffix
                    Value: .json
            Queue: !GetAtt ReportRequestsQueue.Arn
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  # =====================================================================
  # Queues: SQS & DLQ
  # =====================================================================
  ReportRequestsDlq:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests-dlq"
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportRequestsQueue:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${ProjectName}-report-requests"
      VisibilityTimeout: 360
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReportRequestsDlq.Arn
        maxReceiveCount: 3
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportRequestsQueuePolicy:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref ReportRequestsQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt ReportRequestsQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"

  # =====================================================================
  # Scheduler: EventBridge Scheduler
  # =====================================================================
  SchedulerRole:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SendReportRequestPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReportRequestsQueue.Arn

  WeeklyReportSchedule:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: !Sub "${ProjectName}-weekly-report"
      ScheduleExpression: "cron(0 7 ? * MON *)"
      ScheduleExpressionTimezone: Europe/Kyiv
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt ReportRequestsQueue.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"week": null, "source": "schedule"}'

  # =====================================================================
  # Builder Lambda (runs in VPC, reads Aurora, writes CSV to S3)
  # =====================================================================
  ReportBuilderLogGroup:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-builder"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportBuilderRole:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaSQSQueueExecutionRole"
      Policies:
        - PolicyName: S3PutReportPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/*"

  ReportBuilderFunction:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-builder"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command: ["app.reports.lambda_handler.handler"]
      Architectures: [!Ref Architecture]
      MemorySize: 512
      Timeout: 60
      Role: !GetAtt ReportBuilderRole.Arn
      LoggingConfig:
        LogGroup: !Ref ReportBuilderLogGroup
      VpcConfig:
        SubnetIds: !Ref SubnetIds
        SecurityGroupIds:
          - !Ref SecurityGroupId
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUsername
          DB_PASSWORD: !Sub "{{resolve:secretsmanager:${DbSecretArn}:SecretString:password}}"
          DB_NULL_POOL: "true"
          REPORTS_BUCKET: !Sub "${ProjectName}-reports-${AWS::AccountId}"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportQueueEventSource:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt ReportRequestsQueue.Arn
      FunctionName: !Ref ReportBuilderFunction
      BatchSize: 1
      Enabled: true

  # =====================================================================
  # Mailer Lambda (runs outside VPC, sends email via SES)
  # =====================================================================
  ReportMailerLogGroup:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-report-mailer"
      RetentionInDays: 7
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportMailerRole:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::IAM::Role
    Properties:
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: MailerPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}/reports/*"
              - Effect: Allow
                Action:
                  - ses:SendEmail
                  - ses:SendRawEmail
                Resource: "*"

  ReportMailerFunction:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-report-mailer"
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt ReportMailerRole.Arn
      Timeout: 30
      MemorySize: 256
      LoggingConfig:
        LogGroup: !Ref ReportMailerLogGroup
      Environment:
        Variables:
          REPORTS_FROM_EMAIL: !Ref SenderEmail
          REPORTS_TO_EMAIL: !Ref RecipientEmail
      Code:
        ZipFile: |
          import email.message
          import logging
          import os
          import urllib.parse
          from typing import Any
          import boto3

          logger = logging.getLogger("report-mailer")
          if not logger.handlers:
              logging.basicConfig(level=logging.INFO, format="%(asctime)s [%(levelname)s] %(name)s: %(message)s")
          logger.setLevel(logging.INFO)

          def handler(event: dict[str, Any], context: Any = None) -> dict[str, Any]:
              records = event.get("Records", [])
              if not records:
                  logger.warning("No records found in event")
                  return {"status": "no_records"}

              s3_info = records[0].get("s3", {})
              bucket = s3_info.get("bucket", {}).get("name")
              raw_key = s3_info.get("object", {}).get("key", "")
              key = urllib.parse.unquote_plus(raw_key)

              logger.info(
                  "report-mailer triggered [trigger=s3, bucket=%s, key=%s]",
                  bucket, key,
                  extra={"trigger": "s3", "bucket": bucket, "key": key}
              )

              if not bucket or not key or not key.startswith("reports/") or not key.endswith(".csv"):
                  logger.info("Skipping non-report key: %s", key)
                  return {"status": "skipped", "key": key}

              sender = os.environ.get("REPORTS_FROM_EMAIL")
              recipient = os.environ.get("REPORTS_TO_EMAIL")
              if not sender or not recipient:
                  raise ValueError("REPORTS_FROM_EMAIL and REPORTS_TO_EMAIL must be set")

              s3 = boto3.client("s3")
              logger.info("Downloading s3://%s/%s...", bucket, key)
              response = s3.get_object(Bucket=bucket, Key=key)
              csv_bytes = response["Body"].read()

              filename = key.split("/")[-1]
              week = filename.removesuffix(".csv")

              msg = email.message.EmailMessage()
              msg["Subject"] = f"Weekly Meetings Report — {week}"
              msg["From"] = sender
              msg["To"] = recipient
              msg.set_content(
                  f"Hello,\n\nPlease find attached the weekly meetings report for {week}.\n\n"
                  f"Generated automatically by the Meetings Scheduler Event-Driven Reporting System.\n"
              )
              msg.add_attachment(csv_bytes, maintype="text", subtype="csv", filename=filename)

              ses = boto3.client("sesv2")
              logger.info("Sending report email to %s...", recipient)
              res = ses.send_email(
                  FromEmailAddress=sender,
                  Destination={"ToAddresses": [recipient]},
                  Content={"Raw": {"Data": msg.as_bytes()}}
              )
              logger.info("Email sent successfully! MessageId: %s", res.get("MessageId"))
              return {"status": "success", "trigger": "s3", "key": key, "message_id": res.get("MessageId")}
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  ReportMailerPermission:
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ReportMailerFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${ProjectName}-reports-${AWS::AccountId}"
      SourceAccount: !Ref "AWS::AccountId"

Outputs:
  ReportsBucketName:
    Description: S3 bucket where weekly report CSV files are stored.
    Value: !Ref ReportsBucket
  QueueUrl:
    Description: SQS queue URL for report requests.
    Value: !Ref ReportRequestsQueue
  DlqUrl:
    Description: SQS DLQ URL for failed report requests.
    Value: !Ref ReportRequestsDlq
  BuilderFunctionName:
    Value: !Ref ReportBuilderFunction
  MailerFunctionName:
    Value: !Ref ReportMailerFunction
  ScheduleArn:
    Value: !GetAtt WeeklyReportSchedule.Arn

