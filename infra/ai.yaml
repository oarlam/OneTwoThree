AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Meetings App - Agenda Parser AI Lambda outside the VPC with Amazon Bedrock access.
  Zero idle cost serverless LLM agenda parser with Lambda Function URL.

Parameters:
  ProjectName:
    Type: String
    Default: meetings
    Description: Name prefix for all resources.
  ImageUri:
    Type: String
    Description: Backend container image URI for the parser Lambda.
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
  ParserModel:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Amazon Bedrock foundation model or inference profile ID.
  CognitoUserPoolId:
    Type: String
    Default: ""
    Description: Cognito user pool ID for verifying ID tokens.
  CognitoClientId:
    Type: String
    Default: ""
    Description: Cognito client ID.

Resources:
  AgendaParserRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-agenda-parser-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-mantle:CreateInference
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  AgendaParserFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-agenda-parser"
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      ImageConfig:
        Command:
          - app.ai.agenda_lambda.handler
      Role: !GetAtt AgendaParserRole.Arn
      Architectures:
        - !Ref Architecture
      MemorySize: 512
      Timeout: 30
      Environment:
        Variables:
          PARSER_MODEL: !Ref ParserModel
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
          COGNITO_CLIENT_ID: !Ref CognitoClientId
          COGNITO_REGION: !Ref "AWS::Region"
      Tags:
        - Key: PROJECT_NAME
          Value: !Ref ProjectName

  AgendaParserFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref AgendaParserFunction
      AuthType: NONE
      Cors:
        AllowOrigins:
          - "*"
        AllowMethods:
          - POST
        AllowHeaders:
          - authorization
          - content-type
        MaxAge: 300

  AgendaParserFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  AgendaParserFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgendaParserFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

Outputs:
  FunctionUrl:
    Description: Lambda Function URL for agenda parser
    Value: !GetAtt AgendaParserFunctionUrl.FunctionUrl
  FunctionName:
    Description: Lambda Function Name
    Value: !Ref AgendaParserFunction
  FunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt AgendaParserFunction.Arn
